[workspace]
members = [
    "crates/yneko-core",
    "crates/yneko-metadata",
    "crates/yneko-source-rules",
    "crates/yneko-storage",
    "crates/yneko-api",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EkaEva/Yneko_Flutter_Rust"
rust-version = "1.94"
version = "0.1.0"

[workspace.dependencies]
flutter_rust_bridge = "2.11.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
yaml_serde = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
